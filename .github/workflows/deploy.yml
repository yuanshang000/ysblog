name: 部署到 Cloudflare

# 推送到默认分支时自动部署。
# GitHub 新仓库默认分支可能是 master 或 main，两者都监听，避免因分支名不匹配而不触发。
on:
  push:
    branches: [main, master]
  # 手动触发（Actions 页面右上角 Run workflow）
  workflow_dispatch:

concurrency:
  # 同一分支的并发部署取消旧的，避免资源竞争
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: 构建并部署
    runs-on: ubuntu-latest
    # 只有手动触发时需要显式授权（自动推送已在仓库内授权）
    permissions:
      contents: read

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node.js 20（启用 npm 缓存）
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          # 缓存键包含 package-lock.json 哈希，lock 变更（如补全平台包）时自动失效
          cache: 'npm'

      - name: 安装依赖
        # 用 npm ci 严格按 lock 安装，保证与本地一致
        run: npm ci --no-audit --no-fund

      - name: 类型检查
        run: npm run typecheck

      - name: 单元测试
        run: npx vitest run

      # 构建前台 + 后台，并校验产物完整性
      - name: 构建前端资源
        run: npm run build:ci

      - name: 拉取 Cloudflare 凭据
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # ---- 基础设施准备（幂等：已存在则跳过）----
      # R2 桶不存在才创建。解析逻辑放在 scripts/ensure-r2.sh：
      # wrangler 各版本输出格式不同（键值文本 vs 表格），内联脚本难以兼容，
      # 且脚本可本地实测。
      - name: 确认 R2 存储桶存在
        run: |
          set -euo pipefail
          echo "API Token: ${CLOUDFLARE_API_TOKEN:+已设置}${CLOUDFLARE_API_TOKEN:-未设置}"
          echo "Account ID: ${CLOUDFLARE_ACCOUNT_ID:-未设置}"
          echo "--- R2 原始输出 ---"
          npx wrangler r2 bucket list 2>&1 | head -30
          echo "--- 开始检查 ---"
          chmod +x scripts/ensure-r2.sh
          ./scripts/ensure-r2.sh myblog-media

      # D1 必须先创建才能拿到 database_id。
      # 用独立脚本而非内联 JSON 解析 —— wrangler 各版本 d1 list --json 的字段名不一致，
      # 且脚本可本地实测（见 scripts/ensure-d1.sh 头部注释）。
      #
      # 重要：仅当配置里仍是占位符时才去查询。
      # 对于已经把真实 database_id 填进仓库的部署，跳过本步骤可避免
      # 因 API Token 缺少 D1 读权限而让整个流水线失败 ——
      # database_id 本来就已经是确定的了，没必要为此多一道权限依赖。
      - name: 确认 D1 数据库存在
        id: d1
        run: |
          set -euo pipefail
          if ! grep -q "REPLACE_WITH_YOUR_D1_ID" wrangler.jsonc; then
            echo "wrangler.jsonc 中已有真实 database_id，跳过 D1 查询"
            echo "database_id=already-configured" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          chmod +x scripts/ensure-d1.sh
          ID=$(./scripts/ensure-d1.sh myblog || true)
          if [ -z "$ID" ]; then
            echo "::error::未能获取 D1 database_id（若 Token 缺少 D1 权限，可手动把 database_id 填入 wrangler.jsonc）"
            exit 1
          fi
          echo "database_id=$ID" >> "$GITHUB_OUTPUT"
          echo "已确认 database_id=$ID"

      # 把真实 database_id 写回配置文件（替换占位符）
      - name: 回填 database_id
        run: |
          ID="${{ steps.d1.outputs.database_id }}"
          if [ -z "$ID" ]; then
            echo "::error::未能获取 database_id，无法继续部署"
            exit 1
          fi

          # 上一步判定配置中已有真实 ID 时会输出 already-configured，
          # 此时无需也不能再做替换，否则会把该标记写进 wrangler.jsonc。
          if [ "$ID" = "already-configured" ]; then
            echo "配置中已是真实 database_id，无需回填"
            grep -n "database_id" wrangler.jsonc | head -2
            exit 0
          fi

          echo "使用 database_id=$ID"
          sed -i "s/REPLACE_WITH_YOUR_D1_ID/$ID/g" wrangler.jsonc

          # 校验默认环境的占位符已替换。
          # 注意：staging 的 REPLACE_WITH_STAGING_D1_ID 不阻塞本次部署
          #（deploy 只读默认环境），它由 staging 的独立工作流或手动部署处理。
          if grep -q "REPLACE_WITH_YOUR_D1_ID" wrangler.jsonc; then
            echo "::error::默认环境的 database_id 回填失败，占位符仍存在"
            exit 1
          fi
          echo "✓ database_id 已回填"
          grep -n "database_id" wrangler.jsonc | head -2

      # 迁移放在部署之前：
      # 迁移失败则不部署，避免代码已上线但表结构不匹配导致运行时 500
      - name: 执行数据库迁移
        run: |
          set -euo pipefail
          # 先打印诊断信息：CI 失败时无需再翻日志即可判断是凭据还是网络问题。
          # 注意只输出「是否存在」与脱敏后的 ID，不打印任何密钥。
          echo "CLOUDFLARE_API_TOKEN 是否已设置: ${CLOUDFLARE_API_TOKEN:+是}${CLOUDFLARE_API_TOKEN:-否}"
          echo "CLOUDFLARE_ACCOUNT_ID: ${CLOUDFLARE_ACCOUNT_ID:-未设置}"
          echo "待应用的迁移文件："
          ls -1 migrations/
          echo "--- 开始迁移 ---"
          npx wrangler d1 migrations apply myblog --remote

      - name: 部署
        run: npx wrangler deploy

      - name: 输出访问地址
        run: |
          echo "::notice::部署完成。访问 Cloudflare 控制台 → Workers → myblog 查看域名"
          echo "::notice::首次部署后请立即设置密钥："
          echo "::notice::  npx wrangler secret put SESSION_SECRET"
          echo "::notice::  npx wrangler secret put IP_HASH_SALT"