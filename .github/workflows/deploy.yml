name: 部署到 Cloudflare

# 推送到默认分支时自动部署。
# GitHub 新仓库默认分支可能是 master 或 main，两者都监听，避免因分支名不匹配而不触发。
on:
  push:
    branches: [main, master]
  # 手动触发（Actions 页面右上角 Run workflow）
  workflow_dispatch:

concurrency:
  # 同一分支的并发部署取消旧的，避免资源竞争
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: 构建并部署
    runs-on: ubuntu-latest
    # 只有手动触发时需要显式授权（自动推送已在仓库内授权）
    permissions:
      contents: read

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node.js 20（启用 npm 缓存）
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          # 缓存键包含 package-lock.json 哈希，lock 变更（如补全平台包）时自动失效
          cache: 'npm'

      - name: 安装依赖
        # 用 npm ci 严格按 lock 安装，保证与本地一致
        run: npm ci --no-audit --no-fund

      - name: 类型检查
        run: npm run typecheck

      - name: 单元测试
        run: npx vitest run

      # 构建前台 + 后台，并校验产物完整性
      - name: 构建前端资源
        run: npm run build:ci

      # ---- 凭据注入 ----
      # 关键：wrangler-action 只用它自己的输入去完成登录动作，
      # 并不会把 CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID 导出为后续步骤的环境变量。
      # 因此凡是本工作流里直接调用 `npx wrangler ...` 的步骤，
      # 都必须自己从 secrets 显式注入这两个变量，否则非交互环境下会报
      # 「it's necessary to set a CLOUDFLARE_API_TOKEN environment variable」。
      - name: 拉取 Cloudflare 凭据
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: 导出 Cloudflare 环境变量
        run: |
          # 直接从 secrets 取值写入 GITHUB_ENV，比依赖 wrangler-action 的副作用可靠：
          # 后者只用于完成自身的登录动作，并不会把凭据导出给后续 run 步骤。
          echo "::add-mask::${{ secrets.CLOUDFLARE_API_TOKEN }}"
          echo "CLOUDFLARE_API_TOKEN=${{ secrets.CLOUDFLARE_API_TOKEN }}" >> "$GITHUB_ENV"
          echo "CLOUDFLARE_ACCOUNT_ID=${{ secrets.CLOUDFLARE_ACCOUNT_ID }}" >> "$GITHUB_ENV"
          echo "凭据已导出到后续步骤的环境变量"

      # ---- 基础设施准备（幂等：已存在则跳过）----
      # R2 桶不存在才创建。解析逻辑放在 scripts/ensure-r2.sh：
      # wrangler 各版本输出格式不同（键值文本 vs 表格），内联脚本难以兼容，
      # 且脚本可本地实测。
      - name: 确认 R2 存储桶存在
        run: |
          set -euo pipefail
          echo "API Token: ${CLOUDFLARE_API_TOKEN:+已设置}${CLOUDFLARE_API_TOKEN:-未设置}"
          echo "Account ID: ${CLOUDFLARE_ACCOUNT_ID:-未设置}"
          echo "--- R2 原始输出 ---"
          # 这里不能加 `set -o pipefail` 敏感的写法：诊断命令本身失败会让整个步骤
          # 在到达真正的检查逻辑之前就中止，比没有诊断更糟。
          # 因此显式忽略其退出码，诊断信息照常打印，检查逻辑照常执行。
          npx wrangler r2 bucket list 2>&1 | head -30 || true
          echo "--- 开始检查 ---"
          chmod +x scripts/ensure-r2.sh
          ./scripts/ensure-r2.sh myblog-media

      # D1 必须先创建才能拿到 database_id。
      # 用独立脚本而非内联 JSON 解析 —— wrangler 各版本 d1 list --json 的字段名不一致，
      # 且脚本可本地实测（见 scripts/ensure-d1.sh 头部注释）。
      #
      # 重要：仅当配置里仍是占位符时才去查询。
      # 对于已经把真实 database_id 填进仓库的部署，跳过本步骤可避免
      # 因 API Token 缺少 D1 读权限而让整个流水线失败 ——
      # database_id 本来就已经是确定的了，没必要为此多一道权限依赖。
      - name: 确认 D1 数据库存在
        id: d1
        run: |
          set -euo pipefail
          if ! grep -q "REPLACE_WITH_YOUR_D1_ID" wrangler.jsonc; then
            echo "wrangler.jsonc 中已有真实 database_id，跳过 D1 查询"
            echo "database_id=already-configured" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          chmod +x scripts/ensure-d1.sh
          ID=$(./scripts/ensure-d1.sh myblog || true)
          if [ -z "$ID" ]; then
            echo "::error::未能获取 D1 database_id（若 Token 缺少 D1 权限，可手动把 database_id 填入 wrangler.jsonc）"
            exit 1
          fi
          echo "database_id=$ID" >> "$GITHUB_OUTPUT"
          echo "已确认 database_id=$ID"

      # 把真实 database_id 写回配置文件（替换占位符）
      - name: 回填 database_id
        run: |
          ID="${{ steps.d1.outputs.database_id }}"
          if [ -z "$ID" ]; then
            echo "::error::未能获取 database_id，无法继续部署"
            exit 1
          fi

          # 上一步判定配置中已有真实 ID 时会输出 already-configured，
          # 此时无需也不能再做替换，否则会把该标记写进 wrangler.jsonc。
          if [ "$ID" = "already-configured" ]; then
            echo "配置中已是真实 database_id，无需回填"
            grep -n "database_id" wrangler.jsonc | head -2
            exit 0
          fi

          echo "使用 database_id=$ID"
          sed -i "s/REPLACE_WITH_YOUR_D1_ID/$ID/g" wrangler.jsonc

          # 校验默认环境的占位符已替换。
          # 注意：staging 的 REPLACE_WITH_STAGING_D1_ID 不阻塞本次部署
          #（deploy 只读默认环境），它由 staging 的独立工作流或手动部署处理。
          if grep -q "REPLACE_WITH_YOUR_D1_ID" wrangler.jsonc; then
            echo "::error::默认环境的 database_id 回填失败，占位符仍存在"
            exit 1
          fi
          echo "✓ database_id 已回填"
          grep -n "database_id" wrangler.jsonc | head -2

      # 迁移放在部署之前：
      # 迁移失败则不部署，避免代码已上线但表结构不匹配导致运行时 500
      - name: 执行数据库迁移
        id: migrate
        run: |
          set -euo pipefail
          echo "CLOUDFLARE_API_TOKEN: ${CLOUDFLARE_API_TOKEN:+已设置}${CLOUDFLARE_API_TOKEN:-未设置}"
          echo "CLOUDFLARE_ACCOUNT_ID: ${CLOUDFLARE_ACCOUNT_ID:-未设置}"
          echo "迁移文件：$(ls -1 migrations/ | tr '\n' ' ')"
          echo "--- 迁移输出开始 ---"
          # 用 tee 同时保留输出与退出码：既能把真实报错打印到日志，
          # 又能拿到 wrangler 的退出码（PIPESTATUS[0] 才是 wrangler 的）。
          set +e
          npx wrangler d1 migrations apply myblog --remote 2>&1 | tee /tmp/migrate.log
          CODE=${PIPESTATUS[0]}
          set -e
          echo "--- 迁移输出结束（退出码 $CODE）---"
          if [ "$CODE" -ne 0 ]; then
            # 逐行输出为 error 注释：注释内容会进入 check-run annotations，
            # 无需打开（需登录的）完整日志页也能看到失败原因。
            # 输出「全部非空行」而非尾部：wrangler 的真实报错常在版本警告之前，
            # 只取尾部会正好把它截掉。
            echo "::error::数据库迁移失败，退出码 $CODE。wrangler 完整输出："
            # 去掉 CR 与 GitHub 命令里的元字符（% \r），否则会破坏注解解析
            tr -d '\r' < /tmp/migrate.log \
              | grep -v '^[[:space:]]*$' \
              | sed 's/%/%25/g' \
              | while IFS= read -r line; do
                  echo "::error::$line"
                done
            # 同时写入 job 摘要，便于在 Actions 页面直接查看
            {
              echo '### 数据库迁移失败'
              echo '```'
              cat /tmp/migrate.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            exit "$CODE"
          fi
          echo "✅ 迁移完成（可能无待应用项）"

      - name: 部署
        run: npx wrangler deploy

      - name: 输出访问地址
        run: |
          echo "::notice::部署完成。访问 Cloudflare 控制台 → Workers → myblog 查看域名"
          echo "::notice::首次部署后请立即设置密钥："
          echo "::notice::  npx wrangler secret put SESSION_SECRET"
          echo "::notice::  npx wrangler secret put IP_HASH_SALT"